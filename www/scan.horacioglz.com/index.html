<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Summer Camp Attendance</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>

    <script src="https://unpkg.com/@zxing/library@0.23.0"></script>

</head>
<body>
<div class="main-container">
    <div class="card" id="uiCard">
        <h1>Summer Camp Scanner</h1>
        <div id="status">Tap <strong>Start</strong>, then choose a mode</div>
        <button id="startBtn" class="btn primary">Start scanning</button>

        <div class="controls-section" style="display:none">
            <div class="controls">
                <button class="btn" data-mode="checkin">Check In</button>
                <button class="btn" data-mode="checkout">Check Out</button>
            </div>
            <div class="controls">
                <button class="btn" data-mode="points">+1 Point</button>
                <button class="btn" data-mode="nopoints">No Points</button>
            </div>
        </div>
    </div>

    <!-- Scanner feed appears below the card -->
    <div id="reader" style="display:none">
        <video id="video" autoplay muted playsinline></video>
    </div>
</div>

<script src="index.js" defer></script>
</body>
</html>
