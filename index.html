<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Summer Camp Attendance</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- QR‑scanner library (pure JS) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

</head>
<body>
  <div class="card">
    <h1>Summer Camp Scanner</h1>

    <div id="status">Select a mode to begin</div>

    <div class="controls">
      <button class="btn" onclick="setMode('checkin')">Check In</button>
      <button class="btn" onclick="setMode('checkout')">Check Out</button>
      <button class="btn" onclick="setMode('points')">+1 Point</button>
    </div>

    <div id="reader"></div>
  </div>
  <script src="index.js"></script>
</body>
</html>
