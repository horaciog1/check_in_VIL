<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Summer Camp Attendance</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@zxing/library@0.23.0/umd/index.min.js"
            integrity="sha384-0ASr5PEWAMtTnWsn0PzKmioHVDA4+QqFiJr94io/0DCrGP6E1gRAmbO6O8y5WZW9"
            crossorigin="anonymous"></script>

</head>
<body>
<div class="main-container">
    <div class="card" id="uiCard">
        <h1>Summer Camp Scanner</h1>
        <div id="status" role="status" aria-live="polite">Tap <strong>Start</strong>, then choose a mode</div>
        <button type="button" id="startBtn" class="btn primary">Start scanning</button>

        <div class="form-links" id="formLinks">
            <span class="form-links-label">Quick Links</span>
            <div class="form-links-row">
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfl4MP3GXaEk_krlFC-ymEjR7e4ztuZWX3ov7q-TOT1U-wsrA/viewform"
                   target="_blank" rel="noopener"
                   class="btn btn-link"
                   aria-label="Incident Report form (opens in new tab)">Incident Report</a>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfevTs_JrwfxEeV7Lnlwq7duwWzkRarvR_MBNb6jry2w2SarQ/viewform"
                   target="_blank" rel="noopener"
                   class="btn btn-link"
                   aria-label="VILSA Tech Ticket form (opens in new tab)">Tech Ticket</a>
            </div>
        </div>

        <div class="controls-section" style="display:none">
            <div class="controls">
                <button type="button" class="btn" data-mode="checkin">Check In</button>
                <button type="button" class="btn" data-mode="checkout">Check Out</button>
            </div>
            <div class="controls">
                <button type="button" class="btn" data-mode="points">+1 Point</button>
                <button type="button" class="btn" data-mode="nopoints">No Points</button>
            </div>
            <button type="button" id="backBtn" class="btn btn-back" aria-label="Back to home">&#8592; Back</button>
        </div>
    </div>

    <!-- Scanner feed appears below the card -->
    <div id="reader" style="display:none">
        <!-- autoplay required: element is a camera viewfinder, not media playback -->
        <video id="video" autoplay muted playsinline></video>
    </div>
</div>

<script src="index.js" defer></script>
</body>
</html>
