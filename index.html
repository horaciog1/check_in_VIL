<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Summer Camp Attendance</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico">


  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- QR‑scanner library (pure JS) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

</head>
<body>
  <div class="card">
    <h1>Summer Camp Scanner</h1>
  
    <div id="status">Tap <strong>Start</strong>, then choose a mode</div>
  
    <!-- NEW -->
    <button id="startBtn" class="btn primary">Start scanning</button>
  
    <div class="controls" style="display:none">
      <button class="btn" data-mode="checkin">Check&nbsp;In</button>
      <button class="btn" data-mode="checkout">Check&nbsp;Out</button>
      <button class="btn" data-mode="points">+1&nbsp;Point</button>
    </div>
  
    <div id="reader" style="display:none"></div>
  </div>
  
  <script src="index.js" defer></script>
</body>
</html>
